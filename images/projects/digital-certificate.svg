<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" role="img" aria-labelledby="title desc">
  <title id="title">Digital certificate repository project cover</title>
  <desc id="desc">A certificate repository app cover with document cards, phone previews, and secure cloud shapes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e8ff"/>
      <stop offset="0.5" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1e1b4b" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="900" height="506" fill="url(#bg)"/>
  <circle cx="120" cy="388" r="138" fill="#ffffff" opacity="0.46"/>
  <circle cx="782" cy="92" r="96" fill="#ffffff" opacity="0.52"/>
  <path d="M0 422 C130 364 266 386 398 344 C540 300 682 313 900 242 L900 506 L0 506Z" fill="#c7d2fe" opacity="0.55"/>

  <g transform="translate(58 62)">
    <text x="0" y="0" dominant-baseline="hanging" font-family="Arial, sans-serif" font-size="55" font-weight="800" fill="#24143f">CERT VAULT</text>
    <text x="0" y="66" dominant-baseline="hanging" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#6d28d9">Digital Certificate Repository</text>
    <text x="0" y="116" dominant-baseline="hanging" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#5b6474">Role-based access with cloud storage</text>
  </g>

  <g transform="translate(362 74)" filter="url(#shadow)">
    <rect x="120" y="0" width="192" height="342" rx="34" fill="#17172f"/>
    <rect x="137" y="34" width="158" height="276" rx="18" fill="#ffffff"/>
    <rect x="158" y="62" width="116" height="14" rx="7" fill="#c4b5fd"/>
    <rect x="158" y="100" width="116" height="90" rx="14" fill="#ede9fe"/>
    <path d="M180 132 L206 158 L252 112" fill="none" stroke="#7c3aed" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="158" y="214" width="116" height="12" rx="6" fill="#dbeafe"/>
    <rect x="158" y="242" width="92" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="158" y="270" width="116" height="24" rx="12" fill="url(#accent)"/>

    <rect x="0" y="102" width="166" height="112" rx="18" fill="#ffffff"/>
    <rect x="20" y="126" width="86" height="12" rx="6" fill="#c4b5fd"/>
    <rect x="20" y="158" width="126" height="11" rx="5.5" fill="#e2e8f0"/>
    <rect x="20" y="184" width="92" height="11" rx="5.5" fill="#dbeafe"/>

    <rect x="280" y="152" width="174" height="122" rx="18" fill="#ffffff"/>
    <rect x="304" y="178" width="110" height="12" rx="6" fill="#93c5fd"/>
    <rect x="304" y="212" width="126" height="11" rx="5.5" fill="#e2e8f0"/>
    <rect x="304" y="238" width="82" height="11" rx="5.5" fill="#dbeafe"/>
  </g>
</svg>
