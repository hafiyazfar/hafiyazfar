<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" role="img" aria-labelledby="title desc">
  <title id="title">Inventory management system project cover</title>
  <desc id="desc">A dashboard-style project image with inventory cards, product boxes, and stock charts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff4ff"/>
      <stop offset="0.55" stop-color="#eef7ff"/>
      <stop offset="1" stop-color="#cfeee7"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132238"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#123" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="900" height="506" fill="url(#bg)"/>
  <circle cx="92" cy="88" r="76" fill="#ffffff" opacity="0.62"/>
  <circle cx="812" cy="388" r="118" fill="#ffffff" opacity="0.55"/>
  <path d="M0 413 C140 358 229 427 362 376 C505 321 617 344 900 292 L900 506 L0 506Z" fill="#bdeee5" opacity="0.72"/>

  <g transform="translate(58 64)">
    <text x="0" y="0" dominant-baseline="hanging" font-family="Arial, sans-serif" font-size="56" font-weight="800" fill="#16213e">INVENTORY</text>
    <text x="0" y="66" dominant-baseline="hanging" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#2563eb">Management System</text>
    <text x="0" y="116" dominant-baseline="hanging" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#4b5563">Stock tracking, products, and reports</text>
  </g>

  <g transform="translate(350 96)" filter="url(#shadow)">
    <rect width="420" height="280" rx="26" fill="url(#panel)"/>
    <rect x="24" y="28" width="372" height="224" rx="18" fill="#f8fafc"/>
    <rect x="48" y="56" width="144" height="52" rx="12" fill="#dbeafe"/>
    <rect x="212" y="56" width="136" height="52" rx="12" fill="#ccfbf1"/>
    <rect x="48" y="130" width="300" height="15" rx="7.5" fill="#cbd5e1"/>
    <rect x="48" y="162" width="252" height="15" rx="7.5" fill="#e2e8f0"/>
    <rect x="48" y="194" width="320" height="15" rx="7.5" fill="#cbd5e1"/>
    <path d="M66 232 L116 194 L158 214 L208 164 L260 184 L326 124" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="116" cy="194" r="8" fill="#0f766e"/>
    <circle cx="208" cy="164" r="8" fill="#0f766e"/>
    <circle cx="326" cy="124" r="8" fill="#0f766e"/>
  </g>

  <g transform="translate(74 284)" filter="url(#shadow)">
    <rect x="0" y="54" width="92" height="76" rx="10" fill="#f59e0b"/>
    <path d="M0 54 L46 24 L92 54 L46 84Z" fill="#fbbf24"/>
    <path d="M46 84 L46 130" stroke="#b45309" stroke-width="4"/>
    <rect x="122" y="20" width="118" height="110" rx="12" fill="#0f766e"/>
    <path d="M122 20 L181 -8 L240 20 L181 52Z" fill="#14b8a6"/>
    <rect x="146" y="78" width="68" height="14" rx="7" fill="#ccfbf1"/>
  </g>
</svg>
